<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aaklan Infra Consultancy - Letterhead</title>
  <style>
    :root {
      --navy: #0a3158;
      --ink: #182333;
      --muted: #5c6673;
      --line: #aeb8c4;
      --fine: #d9e0e7;
      --orange: #ef6f05;
      --green: #2c7f3a;
      --screen: #edf2f6;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--screen);
      color: var(--ink);
      font-family: "Segoe UI", Arial, Helvetica, sans-serif;
      line-height: 1.45;
    }

    .print-toolbar {
      display: flex;
      justify-content: center;
      padding: 12px;
      background: #10243a;
    }

    .print-toolbar button {
      border: 0;
      border-radius: 5px;
      padding: 9px 18px;
      color: #ffffff;
      background: var(--orange);
      font: 700 13px "Segoe UI", Arial, Helvetica, sans-serif;
      cursor: pointer;
    }

    .page {
      width: 210mm;
      min-height: 297mm;
      margin: 16px auto;
      padding: 14mm 16mm 12mm;
      background: #fff;
      box-shadow: 0 16px 42px rgba(23, 38, 54, 0.16);
      position: relative;
    }

    .letterhead {
      padding-bottom: 5mm;
      border-bottom: 1.2pt solid var(--navy);
    }

    .identity {
      display: grid;
      grid-template-columns: 31mm 1fr;
      gap: 6mm;
      align-items: center;
    }

    .logo {
      width: 29mm;
      height: 29mm;
      object-fit: contain;
      display: block;
    }

    .firm-name {
      margin: 0;
      color: var(--navy);
      font-size: 40.3px;
      line-height: 1.05;
      font-weight: 850;
      letter-spacing: 0;
      text-transform: none;
      white-space: nowrap;
    }

    .firm-type {
      margin: 2px 0 0;
      color: var(--green);
      font-size: 19.5px;
      font-weight: 750;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .services {
      margin: 4px 0 0;
      color: var(--orange);
      font-size: 15px;
      font-weight: 750;
      letter-spacing: 0.2px;
      text-transform: uppercase;
    }

    .details {
      margin-top: 3.8mm;
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 8mm;
      color: var(--ink);
      font-size: 12px;
      line-height: 1.45;
    }

    .details strong {
      color: #000000;
      font-weight: 850;
    }

    .registration {
      text-align: right;
      white-space: nowrap;
    }

    
    .watermark {
      position: absolute;
      top: 128mm;
      left: 50%;
      width: 85mm;
      transform: translateX(-50%);
      opacity: 0.045;
      pointer-events: none;
    }

    .blank-area {
      min-height: 215mm;
    }

    @page {
      size: A4;
      margin: 0;
    }

    @media print {
      body {
        background: transparent;
      }

      .print-toolbar {
        display: none;
      }

      .page {
        width: 210mm;
        min-height: 297mm;
        margin: 0;
        background: transparent;
        box-shadow: none;
      }

    }
  </style>
</head>
